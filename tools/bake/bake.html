<!doctype html><html><head><meta charset="utf-8"><title>fireplace density bake</title></head><body>
<canvas id="c"></canvas>
<script>
// Renders the original card's fireField() frame by frame and POSTs each frame
// (8-bit, value = density/1.6, rows bottom-up) to the collector in bake_server.py.
const post = async (path, body) => {
  for (let i = 0; ; i++) {
    try { const r = await fetch(path, { method: "POST", body }); if (r.ok) return r; throw new Error("HTTP " + r.status); }
    catch (e) { if (i >= 5) throw e; await new Promise((r) => setTimeout(r, 200 * 2 ** i)); }
  }
};
const VERT = "attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }";
function frag(common) { return `precision highp float;
uniform vec2 uRes; uniform float uY0, uY1, uA, uBase, uH, uTa, uTb, uW, uFront;
${common}
float field(vec2 p, float t){
  vec2 uv = vec2(p.x / uA, p.y);
  float edge = smoothstep(0.0, 0.07 * uA, uv.x * uA) * smoothstep(0.0, 0.07 * uA, (1.0 - uv.x) * uA);
  if (uFront > 0.5) return max(fireField(vec2(p.x + 0.37, p.y - uBase + 0.035), t * 1.08, uH * 0.42, 11.7), 0.0) * edge;
  return max(fireField(vec2(p.x, p.y - uBase), t, uH, 0.0) * edge, 0.0);
}
void main(){
  vec2 f = gl_FragCoord.xy / uRes;
  vec2 p = vec2(f.x * uA, mix(uY0, uY1, f.y));
  float v = field(p, uTa);
  if (uW < 1.0) v = mix(field(p, uTb), v, uW);
  gl_FragColor = vec4(vec3(clamp(v / 1.6, 0.0, 1.0)), 1.0);
}`; }
async function main() {
  const jobs = await (await fetch("jobs.json")).json();
  const common = await (await fetch("fire.glsl")).text();
  const cv = document.getElementById("c");
  const gl = cv.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, frag(common)));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const u = (n) => gl.getUniformLocation(pr, n);
  for (const j of jobs) {
    cv.width = j.w; cv.height = j.h; gl.viewport(0, 0, j.w, j.h);
    gl.uniform2f(u("uRes"), j.w, j.h); gl.uniform1f(u("uY0"), j.y0); gl.uniform1f(u("uY1"), j.y1);
    gl.uniform1f(u("uA"), j.aspect); gl.uniform1f(u("uBase"), j.base); gl.uniform1f(u("uH"), j.height);
    gl.uniform1f(u("uFront"), j.field === "front" ? 1 : 0);
    const px = new Uint8Array(j.w * j.h * 4), out = new Uint8Array(j.w * j.h);
    const dt = j.speed / j.fps;
    for (let i = 0; i < j.frames; i++) {
      const ta = j.t0 + i * dt, tb = j.t0 + (i + j.frames) * dt;
      gl.uniform1f(u("uTa"), ta); gl.uniform1f(u("uTb"), tb);
      gl.uniform1f(u("uW"), i < j.xfade ? i / j.xfade : 1.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.readPixels(0, 0, j.w, j.h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (let k = 0; k < out.length; k++) out[k] = px[k * 4];
      await post(`/frame?job=${j.name}&i=${i}`, out);
    }
    await post(`/done?job=${j.name}`, "");
  }
  await post("/alldone", "");
}
main().catch((e) => post("/error", String(e && e.stack || e)));
</script></body></html>
